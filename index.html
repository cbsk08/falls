<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FALLS 100</title>
<!-- iOS PWA設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FALLS100">
<meta name="theme-color" content="#0a0e14">
<!-- アイコン：縦線3本＋雫（流水の抽象） -->
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0%25' stop-color='%2300d9ff'/><stop offset='100%25' stop-color='%23ff2d92'/></linearGradient></defs><rect width='180' height='180' rx='40' fill='%230a0e14'/><line x1='54' y1='40' x2='54' y2='140' stroke='url(%23g)' stroke-width='8' stroke-linecap='round'/><line x1='90' y1='52' x2='90' y2='128' stroke='url(%23g)' stroke-width='8' stroke-linecap='round'/><line x1='126' y1='40' x2='126' y2='140' stroke='url(%23g)' stroke-width='8' stroke-linecap='round'/><circle cx='54' cy='150' r='6' fill='%23ff2d92'/><circle cx='90' cy='138' r='6' fill='%23ff2d92'/><circle cx='126' cy='150' r='6' fill='%23ff2d92'/></svg>">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0%25' stop-color='%2300d9ff'/><stop offset='100%25' stop-color='%23ff2d92'/></linearGradient></defs><rect width='180' height='180' rx='40' fill='%230a0e14'/><line x1='54' y1='40' x2='54' y2='140' stroke='url(%23g)' stroke-width='8' stroke-linecap='round'/><line x1='90' y1='52' x2='90' y2='128' stroke='url(%23g)' stroke-width='8' stroke-linecap='round'/><line x1='126' y1='40' x2='126' y2='140' stroke='url(%23g)' stroke-width='8' stroke-linecap='round'/><circle cx='54' cy='150' r='6' fill='%23ff2d92'/><circle cx='90' cy='138' r='6' fill='%23ff2d92'/><circle cx='126' cy='150' r='6' fill='%23ff2d92'/></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #0a0e14;
    --bg-elev: #131820;
    --bg-card: #1a2030;
    --line: #232a3a;
    --line-soft: #1a1f2c;
    --text: #e6edf3;
    --text-soft: #8b96a8;
    --text-mute: #5a6478;
    --accent: #00d9ff;
    --accent-glow: rgba(0, 217, 255, 0.4);
    --accent-dim: rgba(0, 217, 255, 0.15);
    --magenta: #ff2d92;
    --magenta-glow: rgba(255, 45, 146, 0.35);
    --gold: #ffb84d;
    --visited: #00d9ff;
    --unvisited: #4a5468;
    --danger: #ff4d6d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", "Hiragino Sans", sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  /* ヘッダー */
  header {
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 0;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 24px; height: 24px;
    display: block;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--text);
    text-transform: uppercase;
  }
  h1 .accent { color: var(--accent); }
  .progress {
    font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 0.08em;
  }
  .progress strong {
    color: var(--accent);
    font-weight: 600;
    font-size: 18px;
    text-shadow: 0 0 12px var(--accent-glow);
    margin-right: 2px;
  }
  .progress-bar {
    margin-top: 10px;
    height: 2px;
    background: var(--line-soft);
    overflow: hidden;
    border-radius: 1px;
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--magenta));
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* タブ */
  .tabs {
    display: flex;
    gap: 0;
    margin-top: 10px;
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    color: var(--text-mute);
    background: none;
    border: none;
    border-bottom: 1.5px solid transparent;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s, border-color 0.2s;
    text-transform: uppercase;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    text-shadow: 0 0 8px var(--accent-glow);
  }

  /* メインエリア */
  main {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .view {
    position: absolute;
    inset: 0;
    display: none;
  }
  .view.active { display: block; }

  /* 地図 */
  #map {
    width: 100%;
    height: 100%;
    background: var(--bg);
  }

  /* マーカー */
  .pin {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: block;
    transition: all 0.2s;
    position: relative;
  }
  .pin.unvisited {
    background: #fff;
    border: 2px solid #2a3346;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .pin.visited {
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 0 12px var(--accent-glow), 0 1px 4px rgba(0,0,0,0.3);
  }
  .pin.visited::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 4px; height: 8px;
    border: solid #fff;
    border-width: 0 1.5px 1.5px 0;
    transform: translate(-55%, -65%) rotate(45deg);
  }
  .leaflet-marker-icon:hover .pin { transform: scale(1.2); }

  /* リストビュー */
  .list-view {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    height: 100%;
    background: var(--bg);
  }
  .filter-bar {
    position: sticky;
    top: 0;
    background: rgba(10, 14, 20, 0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    z-index: 5;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid var(--line);
    background: var(--bg-elev);
    color: var(--text-soft);
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .chip.active {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-dim), 0 0 12px var(--accent-glow);
  }
  .list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
    transition: background 0.15s;
  }
  .list-item:active { background: var(--bg-elev); }
  .check-circle {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--unvisited);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .check-circle.visited {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .check-circle.visited::after {
    content: "";
    width: 5px; height: 9px;
    border: solid var(--bg);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .list-item-body { flex: 1; min-width: 0; }
  .list-item-name {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 3px;
    font-weight: 500;
  }
  .list-item-meta {
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 0.04em;
  }
  .list-item-num {
    font-family: "SF Mono", "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--accent);
    margin-right: 8px;
    opacity: 0.8;
  }
  .photo-mini {
    width: 38px; height: 38px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--line);
  }

  /* ボトムシート（詳細） */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .sheet-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-elev);
    border-radius: 16px 16px 0 0;
    border-top: 1px solid var(--line);
    z-index: 1001;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -8px 40px rgba(0, 217, 255, 0.08), 0 -2px 12px rgba(0,0,0,0.5);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 10px auto 4px;
    flex-shrink: 0;
  }
  .sheet-header {
    padding: 8px 18px 14px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .sheet-num {
    font-family: "SF Mono", "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-shadow: 0 0 6px var(--accent-glow);
  }
  .sheet-title {
    display: inline-block;
    font-size: 22px;
    font-weight: 600;
    margin: 4px 0 4px;
    letter-spacing: 0.01em;
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 1px;
    transition: all 0.2s;
  }
  .sheet-title::after {
    content: " ↗";
    font-size: 12px;
    color: var(--text-mute);
    margin-left: 4px;
    vertical-align: 3px;
    font-weight: normal;
  }
  .sheet-title:active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .sheet-kana {
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 0.12em;
  }
  .sheet-loc {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 8px;
  }
  .sheet-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .sheet-difficulty {
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--text-soft);
  }
  .sheet-difficulty .stars {
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-right: 8px;
    text-shadow: 0 0 6px rgba(255, 184, 77, 0.3);
  }
  .sheet-map-btn {
    font-family: "SF Mono", "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--magenta);
    text-decoration: none;
    border: 1px solid var(--magenta);
    padding: 5px 10px;
    border-radius: 4px;
    letter-spacing: 0.12em;
    background: transparent;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .sheet-map-btn:active {
    background: var(--magenta);
    color: var(--bg);
    box-shadow: 0 0 12px var(--magenta-glow);
  }
  .diff-badge {
    flex-shrink: 0;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-left: 8px;
  }
  .sheet-body {
    overflow-y: auto;
    flex: 1;
    padding: 18px;
    -webkit-overflow-scrolling: touch;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .toggle-label {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
  }
  .toggle {
    position: relative;
    width: 46px; height: 26px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 13px;
    cursor: pointer;
    transition: all 0.25s;
    flex-shrink: 0;
  }
  .toggle.on {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 20px; height: 20px;
    background: var(--text);
    border-radius: 50%;
    transition: transform 0.25s;
  }
  .toggle.on::after {
    transform: translateX(20px);
    background: var(--bg);
  }

  .field-label {
    display: block;
    font-family: "SF Mono", "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--text-mute);
    letter-spacing: 0.18em;
    margin: 18px 0 8px;
    text-transform: uppercase;
  }
  input[type="date"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    resize: vertical;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="date"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
  }
  input[type="date"] { color-scheme: dark; }
  textarea { min-height: 80px; }

  .photos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .photo-cell {
    position: relative;
    aspect-ratio: 1;
    background: var(--bg-card);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .photo-cell img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-del {
    position: absolute;
    top: 4px; right: 4px;
    width: 22px; height: 22px;
    background: rgba(10, 14, 20, 0.85);
    backdrop-filter: blur(4px);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }
  .photo-add {
    aspect-ratio: 1;
    border: 1.5px dashed var(--line);
    background: var(--bg-card);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 28px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .photo-add:active {
    background: var(--accent-dim);
    border-color: var(--accent);
  }
  .photo-input { display: none; }

  .save-bar {
    padding: 14px 18px;
    border-top: 1px solid var(--line);
    background: var(--bg-elev);
    flex-shrink: 0;
  }
  .save-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.18em;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 20px var(--accent-glow);
    transition: all 0.2s;
  }
  .save-btn:active {
    transform: scale(0.98);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .save-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ポップアップ */
  .leaflet-popup-content-wrapper {
    border-radius: 8px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(0, 217, 255, 0.1), 0 2px 8px rgba(0,0,0,0.5);
    color: var(--text);
  }
  .leaflet-popup-content { margin: 12px 14px; font-family: inherit; font-size: 13px; }
  .leaflet-popup-tip { background: var(--bg-elev); border: 1px solid var(--line); }
  .leaflet-popup-close-button { color: var(--text-mute) !important; }
  .popup-name { font-weight: 600; margin-bottom: 3px; color: var(--text); }
  .popup-loc { font-size: 11px; color: var(--text-mute); }
  .popup-btn {
    margin-top: 8px;
    padding: 5px 12px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: "SF Mono", "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* 統計セクション */
  .stats-section {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .stats-section h3 {
    font-family: "SF Mono", "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-mute);
    font-weight: 500;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  /* メニューボタン */
  .menu-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-soft);
    cursor: pointer;
    padding: 0;
    letter-spacing: 0.05em;
  }
  .menu-btn:hover { color: var(--accent); }
  .menu-btn.danger:hover { color: var(--danger); }

  /* Leaflet 内部UIをダーク化 */
  .leaflet-container { font-family: inherit; background: var(--bg); }
  .leaflet-control-zoom a {
    background: var(--bg-elev) !important;
    color: var(--text) !important;
    border-color: var(--line) !important;
  }
  .leaflet-control-zoom a:hover {
    background: var(--bg-card) !important;
  }
  .leaflet-control-attribution {
    background: rgba(10, 14, 20, 0.8) !important;
    color: var(--text-mute) !important;
    backdrop-filter: blur(4px);
  }
  .leaflet-control-attribution a { color: var(--text-soft) !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#ff2d92" stop-opacity="0.9"/>
            </linearGradient>
          </defs>
          <line x1="6" y1="2" x2="6" y2="22" stroke="url(#iconGrad)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="12" y1="4" x2="12" y2="20" stroke="url(#iconGrad)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="18" y1="2" x2="18" y2="22" stroke="url(#iconGrad)" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="6" cy="22" r="1.2" fill="#ff2d92"/>
          <circle cx="12" cy="20" r="1.2" fill="#ff2d92"/>
          <circle cx="18" cy="22" r="1.2" fill="#ff2d92"/>
        </svg>
        <h1>FALLS<span class="accent">100</span></h1>
      </div>
      <div class="progress">
        <strong id="visited-count">0</strong><span style="opacity:0.4">/100</span>
      </div>
    </div>

// ===== 状態管理 =====
let visits = {}; // {id: {visited:bool, date:'YYYY-MM-DD', memo:'', photos:[base64...]}}
let currentId = null;
let currentFilter = 'all';
let markers = {};
let db = null;
let storageMode = 'memory'; // 'idb' | 'memory'

// ===== IndexedDB =====
const DB_NAME = 'falls_tracker';
const DB_VERSION = 1;
const STORE = 'visits';

function openDB() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB unsupported')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => resolve(req.result);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
  });
}

function idbGet(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGetAll() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPut(record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).put(record);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function idbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function idbClear() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

async function initStorage() {
  try {
    db = await openDB();
    storageMode = 'idb';
    // ストレージの永続化をリクエスト（iOS Safariはストレージ圧迫時にデータを消すため）
    if (navigator.storage && navigator.storage.persist) {
      try { await navigator.storage.persist(); } catch(e) {}
    }
  } catch(e) {
    console.warn('IndexedDB使用不可、メモリモードに切替:', e);
    storageMode = 'memory';
  }
}

async function loadData() {
  if (storageMode !== 'idb') return;
  try {
    const all = await idbGetAll();
    for (const r of all) {
      visits[r.id] = {
        visited: r.visited || false,
        date: r.date || '',
        memo: r.memo || '',
        photos: r.photos || []
      };
    }
  } catch(e) {
    console.error('読込エラー:', e);
  }
}

async function saveVisit(id) {
  if (storageMode !== 'idb') return { ok: true };
  try {
    const v = visits[id];
    if (!v) {
      await idbDelete(id);
    } else {
      await idbPut({
        id: id,
        visited: v.visited,
        date: v.date,
        memo: v.memo,
        photos: v.photos || []
      });
    }
    return { ok: true };
  } catch(e) {
    console.error('保存エラー:', e);
    return { ok: false, error: e.message || String(e) };
  }
}

function getVisit(id) {
  return visits[id] || { visited: false, date: '', memo: '', photos: [] };
}

const map = L.map('map', {
  center: [37.5, 137.5],
  zoom: 5,
  zoomControl: true,
  attributionControl: true
});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 19
}).addTo(map);

function makeIcon(visited) {
  return L.divIcon({
    className: '',
    html: `<span class="pin ${visited ? 'visited' : 'unvisited'}"></span>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9]
  });
}

function renderMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  FALLS.forEach(f => {
    const v = getVisit(f.id);
    const marker = L.marker([f.lat, f.lng], { icon: makeIcon(v.visited) }).addTo(map);
    marker.bindPopup(`
      <div class="popup-name">${f.name}</div>
      <div class="popup-loc">${f.pref} ${f.city}</div>
      <div class="popup-loc" style="color:var(--gold); margin-top:2px;">${diffStars(f.difficulty)}</div>
      <button class="popup-btn" onclick="openSheet(${f.id})">詳 細</button>
    `);
    markers[f.id] = marker;
  });
}

// ===== タブ切り替え =====
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'map') {
      setTimeout(() => map.invalidateSize(), 50);
    }
    if (btn.dataset.view === 'list') renderList();
    if (btn.dataset.view === 'stats') renderStats();
  });
});

// ===== リストビュー =====
function renderFilterChips() {
  const prefs = [...new Set(FALLS.map(f => f.pref))];
  const bar = document.getElementById('filter-bar');
  const items = [
    { key: 'all', label: '全て' },
    { key: 'visited', label: '訪問済' },
    { key: 'unvisited', label: '未訪問' },
    { key: 'diff:1', label: '★ 楽勝' },
    { key: 'diff:2', label: '★★ 軽め' },
    { key: 'diff:3', label: '★★★ ハイク' },
    { key: 'diff:4', label: '★★★★ 登山' },
    ...prefs.map(p => ({ key: 'pref:' + p, label: p }))
  ];
  bar.innerHTML = items.map(it =>
    `<button class="chip ${currentFilter === it.key ? 'active' : ''}" data-key="${it.key}">${it.label}</button>`
  ).join('');
  bar.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      currentFilter = c.dataset.key;
      renderFilterChips();
      renderListItems();
    });
  });
}

function renderListItems() {
  const container = document.getElementById('list-container');
  let items = FALLS.slice();
  if (currentFilter === 'visited') items = items.filter(f => getVisit(f.id).visited);
  else if (currentFilter === 'unvisited') items = items.filter(f => !getVisit(f.id).visited);
  else if (currentFilter.startsWith('pref:')) {
    const p = currentFilter.slice(5);
    items = items.filter(f => f.pref === p);
  } else if (currentFilter.startsWith('diff:')) {
    const d = parseInt(currentFilter.slice(5));
    items = items.filter(f => f.difficulty === d);
  }
  container.innerHTML = items.map(f => {
    const v = getVisit(f.id);
    const photo = v.photos && v.photos[0] ? `<img class="photo-mini" src="${v.photos[0]}">` : '';
    return `
      <div class="list-item" data-id="${f.id}">
        <div class="check-circle ${v.visited ? 'visited' : ''}"></div>
        <div class="list-item-body">
          <div class="list-item-name"><span class="list-item-num">№${String(f.id).padStart(3,'0')}</span>${f.name}<span class="diff-badge">${diffStars(f.difficulty)}</span></div>
          <div class="list-item-meta">${f.pref}　${f.city}</div>
        </div>
        ${photo}
      </div>
    `;
  }).join('');
  container.querySelectorAll('.list-item').forEach(el => {
    el.addEventListener('click', () => openSheet(parseInt(el.dataset.id)));
  });
}

function renderList() {
  renderFilterChips();
  renderListItems();
}

          <div style="display:flex; align-items:center; gap:10px; padding:7px 0;">
            <span style="font-size:12px; min-width:64px; color:var(--gold); letter-spacing:0.1em; text-shadow:0 0 6px rgba(255,184,77,0.3);">${DIFF_LABELS[lv].stars}</span>
            <span style="font-size:11px; color:var(--text-soft); flex:1;">${DIFF_LABELS[lv].text.split('（')[0]}</span>
            <div style="flex:1; max-width:120px; height:3px; background:var(--line-soft); border-radius:2px; overflow:hidden;">
              <div style="height:100%; width:${total ? (vis/total*100) : 0}%; background:var(--accent); box-shadow:0 0 6px var(--accent-glow);"></div>
            </div>
            <span style="font-size:10px; color:var(--text-mute); font-family:'SF Mono','JetBrains Mono',monospace; min-width:40px; text-align:right;">${vis}/${total}</span>
          </div>
        `;
      }).join('')}
    </div>

    <div class="stats-section">
      <h3>都 道 府 県 別</h3>
      ${sortedPrefs.map(([pref, s]) => `
        <div style="display:flex; align-items:center; gap:10px; padding:6px 0;">
          <span style="font-size:12px; min-width:64px; color:var(--text);">${pref}</span>
          <div style="flex:1; height:3px; background:var(--line-soft); border-radius:2px; overflow:hidden;">
            <div style="height:100%; width:${(s.visited/s.total*100)}%; background:${s.visited === s.total ? 'var(--gold)' : 'var(--accent)'}; box-shadow:0 0 6px ${s.visited === s.total ? 'rgba(255,184,77,0.4)' : 'var(--accent-glow)'};"></div>
          </div>
          <span style="font-size:10px; color:var(--text-mute); font-family:'SF Mono','JetBrains Mono',monospace; min-width:40px; text-align:right;">${s.visited}/${s.total}</span>
        </div>
      `).join('')}
    </div>

    <div class="stats-section">
      <h3>デ ー タ</h3>
      <button class="menu-btn" onclick="exportData()" style="display:block; padding:10px 0; width:100%; text-align:left;">↓ JSONで書き出し</button>
      <button class="menu-btn" onclick="importData()" style="display:block; padding:10px 0; width:100%; text-align:left;">↑ JSONを読み込み</button>
      <button class="menu-btn danger" onclick="resetData()" style="display:block; padding:10px 0; width:100%; text-align:left; color:var(--danger);">× 全データをリセット</button>
    </div>
  `;
}

// ===== シート（詳細） =====
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');

// 難易度の表示
const DIFF_LABELS = {
  1: { stars: '★', text: '楽勝（駐車場すぐ）' },
  2: { stars: '★★', text: '軽め（遊歩道）' },
  3: { stars: '★★★', text: 'ハイキング' },
  4: { stars: '★★★★', text: '本格登山' }
};
function diffStars(level) {
  return DIFF_LABELS[level] ? DIFF_LABELS[level].stars : '';
}
function diffFull(level) {
  if (!DIFF_LABELS[level]) return '';
  return `<span class="stars">${DIFF_LABELS[level].stars}</span>${DIFF_LABELS[level].text}`;
}

function openSheet(id) {
  currentId = id;
  const f = FALLS.find(x => x.id === id);
  const v = getVisit(id);
  document.getElementById('sheet-num').textContent = `№${String(f.id).padStart(3,'0')}`;
  const titleEl = document.getElementById('sheet-title');
  titleEl.textContent = f.name;
  // Wikipedia検索URL（同名の滝も都道府県で曖昧さ解消）
  const searchTerm = encodeURIComponent(f.name + ' ' + f.pref);
  titleEl.href = `https://ja.wikipedia.org/wiki/Special:Search?search=${searchTerm}&go=Go`;
  document.getElementById('sheet-kana').textContent = f.kana;
  document.getElementById('sheet-loc').textContent = `${f.pref}　${f.city}`;
  // 難易度
  document.getElementById('sheet-difficulty').innerHTML = diffFull(f.difficulty);
  // Googleマップ（座標で開く）
  const mapBtn = document.getElementById('sheet-map-btn');
  mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${f.lat},${f.lng}&query_place_id=${encodeURIComponent(f.name)}`;
  document.getElementById('visit-toggle').classList.toggle('on', v.visited);
  document.getElementById('visit-date').value = v.date || '';
  document.getElementById('visit-memo').value = v.memo || '';
  renderPhotos();
  sheet.classList.add('open');
  backdrop.classList.add('open');
  map.closePopup();
}
window.openSheet = openSheet;

function closeSheet() {
  sheet.classList.remove('open');
  backdrop.classList.remove('open');
  currentId = null;
}
backdrop.addEventListener('click', closeSheet);

// 訪問トグル
document.getElementById('visit-toggle').addEventListener('click', () => {
  const t = document.getElementById('visit-toggle');
  t.classList.toggle('on');
  if (t.classList.contains('on') && !document.getElementById('visit-date').value) {
    document.getElementById('visit-date').value = new Date().toISOString().slice(0,10);
  }
});

// 写真
function renderPhotos() {
  const v = getVisit(currentId);
  const grid = document.getElementById('photos-grid');
  let html = '';
  (v.photos || []).forEach((p, i) => {
    html += `<div class="photo-cell"><img src="${p}"><button class="photo-del" data-i="${i}">×</button></div>`;
  });
  html += `<div class="photo-add" id="photo-add-btn">＋</div>`;
  grid.innerHTML = html;
  grid.querySelectorAll('.photo-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.i);
      v.photos.splice(i, 1);
      visits[currentId] = v;
      renderPhotos();
    });
  });
  document.getElementById('photo-add-btn').addEventListener('click', () => {
    document.getElementById('photo-input').click();
  });
}

document.getElementById('photo-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  for (const file of files) {
    const dataUrl = await compressImage(file, 800, 0.7);
    const v = getVisit(currentId);
    if (!v.photos) v.photos = [];
    v.photos.push(dataUrl);
    visits[currentId] = v;
  }
  renderPhotos();
  e.target.value = '';
});

// 画像圧縮（容量節約）
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = h * maxDim / w; w = maxDim; }
        else if (h > maxDim) { w = w * maxDim / h; h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 保存
document.getElementById('save-btn').addEventListener('click', async () => {
  if (!currentId) return;
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = '保存中...';
  const v = getVisit(currentId);
  v.visited = document.getElementById('visit-toggle').classList.contains('on');
  v.date = document.getElementById('visit-date').value;
  v.memo = document.getElementById('visit-memo').value;
  visits[currentId] = v;
  const result = await saveVisit(currentId);
  btn.disabled = false;
  btn.textContent = '保 存';
  if (!result.ok) {
    alert('保存に失敗しました：' + result.error + '\n\n写真の容量が大きすぎる可能性があります。写真を減らすか、解像度を下げて再試行してください。');
    return;
  }
  // マーカー更新
  if (markers[currentId]) {
    markers[currentId].setIcon(makeIcon(v.visited));
  }
  updateProgress();
  closeSheet();
  // 現在のビューを再描画
  if (document.getElementById('view-list').classList.contains('active')) renderListItems();
  if (document.getElementById('view-stats').classList.contains('active')) renderStats();
});

// ===== 進捗表示 =====
function updateProgress() {
  const visited = Object.values(visits).filter(v => v.visited).length;
  document.getElementById('visited-count').textContent = visited;
  document.getElementById('progress-fill').style.width = visited + '%';
}

// ===== データ管理 =====
function exportData() {
  const blob = new Blob([JSON.stringify(visits, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `falls_tracker_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
window.exportData = exportData;

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (typeof data !== 'object') throw new Error();
      if (!confirm('現在の記録を上書きします。よろしいですか？')) return;
      visits = data;
      // 全て保存
      for (const id of Object.keys(visits)) {
        await saveVisit(parseInt(id));
      }
      renderMarkers();
      updateProgress();
      renderStats();
      alert('読み込みました');
    } catch(e) {
      alert('読み込みに失敗しました');
    }
  };
  input.click();
}
window.importData = importData;

async function resetData() {
  if (!confirm('全ての訪問記録と写真を削除します。本当によろしいですか？')) return;
  if (!confirm('この操作は取り消せません。本当に削除しますか？')) return;
  if (storageMode === 'idb') {
    try { await idbClear(); } catch(e) {}
  }
  visits = {};
  renderMarkers();
  updateProgress();
  renderStats();
}
window.resetData = resetData;

// ストレージモード警告を表示
function showStorageWarning() {
  if (storageMode !== 'memory') return;
  const banner = document.createElement('div');
  banner.style.cssText = 'background:rgba(255,77,109,0.1); border-bottom:1px solid var(--danger); color:var(--text); padding:8px 12px; font-size:11px; text-align:center; line-height:1.4;';
  banner.innerHTML = '⚠ 永続保存が利用できません。「STATS」タブから書き出してバックアップしてください。';
  document.querySelector('header').after(banner);
}

// ===== 初期化 =====
(async () => {
  await initStorage();
  await loadData();
  renderMarkers();
  updateProgress();
  showStorageWarning();
})();
</script>
